# Automated data refresh: fetch via akshare on a schedule, commit data/ and
# push - which redeploys the Streamlit site. Mirrors `make update`.
#
# Failure model: fetchers are isolated per indicator (a broken endpoint
# leaves its committed CSV untouched), so partial successes are still
# published; the run is then marked failed so the failure is visible.
# akshare's EastMoney mirror is usually reachable from GitHub runners, and
# every fetcher retries with backoff - if a run still fails, the next
# scheduled run (or `make update` locally) covers it.

name: Refresh data

on:
  schedule:
    # Releases land on Beijing business hours; run after each cluster.
    - cron: "30 2 * * *"   # 10:30 Beijing - NBS / GACC morning releases
    - cron: "15 10 * * *"  # 18:15 Beijing - PBoC afternoon releases
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-fetch.txt

      - name: Install fetch dependencies
        run: pip install -r requirements-fetch.txt

      - name: Fetch latest data
        id: fetch
        continue-on-error: true  # publish whatever succeeded; fail at the end
        run: python -m fetch.run_all

      - name: Commit and push refreshed data
        # Gate on the CSVs, not all of data/: every fetch rewrites the
        # fetched_at_utc timestamps in the .meta.json sidecars, and committing
        # those alone would add two junk commits a day to the data audit
        # trail. When a CSV did change, the metas ride along in the commit.
        run: |
          if [ -n "$(git status --porcelain -- 'data/*.csv')" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "data: refresh $(date -u +%Y-%m-%d) (auto)" -- data/
            git pull --rebase origin main
            git push
          else
            echo "data/ unchanged - nothing to publish"
          fi

      - name: Surface fetch failures
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::One or more fetchers failed; successful indicators were still published. See the fetch step log."
          exit 1
