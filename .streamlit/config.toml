[theme]
# Pinned light theme: the dashboard is a public-facing page and should
# render identically for every reader. Colors follow the project palette
# (muted surfaces, one accent blue; red/green reserved for direction).
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans serif"

[browser]
gatherUsageStats = false
